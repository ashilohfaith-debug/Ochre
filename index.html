<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Noir — a lightweight code editor</title>
<meta name="description" content="A modern, browser-based code editor powered by Monaco Editor." />

<!-- Monospace type: JetBrains Mono (default) + Fira Code (alternate) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Fira+Code:wght@300..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000'/%3E%3Cpath d='M28 32 L46 50 L28 68 M52 68 L74 68' stroke='%237c5cff' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============ BOOT / SPLASH ============ -->
  <!-- Shown instantly while Monaco lazy-loads in the background, so the app never feels blank. -->
  <div id="boot-screen" aria-hidden="true">
    <div class="boot-mark">
      <svg width="44" height="44" viewBox="0 0 100 100" fill="none">
        <rect width="100" height="100" rx="22" fill="#000"/>
        <path d="M28 32 L46 50 L28 68 M52 68 L74 68" stroke="#7c5cff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="boot-label">Loading editor<span class="boot-dots"><span>.</span><span>.</span><span>.</span></span></div>
  </div>

  <div id="app" class="app" aria-busy="true">

    <!-- ============ TOOLBAR ============ -->
    <header class="toolbar" role="toolbar" aria-label="Editor toolbar">
      <div class="toolbar-group toolbar-brand">
        <svg class="brand-mark" width="20" height="20" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <rect width="100" height="100" rx="22" fill="#7c5cff"/>
          <path d="M28 32 L46 50 L28 68 M52 68 L74 68" stroke="#000" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">Noir</span>
        <span class="file-chip" id="file-chip" title="Current file">
          <span id="file-name">untitled.txt</span>
          <span id="unsaved-dot" class="unsaved-dot" hidden></span>
        </span>
      </div>

      <div class="toolbar-group toolbar-actions">
        <button class="tbtn" id="btn-new" data-tip="New file (Ctrl+Alt+N)">
          <svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/><path d="M12 12v6M9 15h6" stroke-linecap="round"/></svg>
          <span>New</span>
        </button>
        <button class="tbtn" id="btn-open" data-tip="Open file (Ctrl+O)">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Open</span>
        </button>
        <button class="tbtn" id="btn-save" data-tip="Save file (Ctrl+S)">
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8" /></svg>
          <span>Save</span>
        </button>
        <input type="file" id="file-input" hidden />

        <span class="tbtn-divider"></span>

        <button class="tbtn icon-only" id="btn-wrap" data-tip="Toggle word wrap" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h13a3 3 0 1 1 0 6h-4m0 0 2-2m-2 2 2 2M3 18h6"/></svg>
        </button>
        <button class="tbtn icon-only" id="btn-minimap" data-tip="Toggle minimap" aria-pressed="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="14" height="16" rx="1.5"/><rect x="19" y="4" width="2" height="16" rx="1"/></svg>
        </button>
        <button class="tbtn icon-only" id="btn-palette" data-tip="Command palette (F1)">
          <svg viewBox="0 0 24 24"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></svg>
        </button>

        <span class="tbtn-divider"></span>

        <div class="font-controls" data-tip="Font size">
          <button class="tbtn icon-only small" id="btn-font-dec" aria-label="Decrease font size">−</button>
          <span id="font-size-display">14</span>
          <button class="tbtn icon-only small" id="btn-font-inc" aria-label="Increase font size">+</button>
        </div>

        <select id="font-family-select" class="tselect" data-tip="Font family">
          <option value="'JetBrains Mono', 'Fira Code', monospace">JetBrains Mono</option>
          <option value="'Fira Code', 'JetBrains Mono', monospace">Fira Code</option>
          <option value="'Consolas', 'Menlo', monospace">Consolas</option>
        </select>

        <select id="language-select" class="tselect" data-tip="Language mode"></select>
      </div>

      <div class="toolbar-group toolbar-menu">
        <button class="tbtn icon-only" id="btn-menu" data-tip="More" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
        </button>
      </div>
    </header>

    <!-- Overflow menu for small screens -->
    <div class="overflow-menu" id="overflow-menu" hidden>
      <button data-action="new">New file</button>
      <button data-action="open">Open file…</button>
      <button data-action="save">Save file</button>
      <button data-action="wrap">Toggle word wrap</button>
      <button data-action="minimap">Toggle minimap</button>
      <button data-action="palette">Command palette</button>
      <button data-action="clear">Clear autosave</button>
    </div>

    <!-- ============ EDITOR SURFACE ============ -->
    <main class="editor-shell">
      <div id="editor-container"></div>

      <!-- Drag & drop overlay -->
      <div id="dropzone-overlay" aria-hidden="true">
        <div class="dropzone-card">
          <svg viewBox="0 0 24 24" width="34" height="34"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <p>Drop file to open</p>
        </div>
      </div>
    </main>

    <!-- ============ STATUS BAR ============ -->
    <footer class="statusbar" role="status">
      <div class="status-left">
        <span class="status-item" id="status-branch">
          <svg viewBox="0 0 24 24" width="13" height="13"><path d="M6 3v12m12-8v2a4 4 0 0 1-4 4H8m4-10a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm12-14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
          local
        </span>
      </div>
      <div class="status-right">
        <button class="status-item status-btn" id="status-position">Ln 1, Col 1</button>
        <button class="status-item status-btn" id="status-indent">Spaces: 2</button>
        <button class="status-item status-btn" id="status-encoding">UTF-8</button>
        <button class="status-item status-btn" id="status-eol">LF</button>
        <button class="status-item status-btn" id="status-language">Plain Text</button>
      </div>
    </footer>
  </div>

  <!-- Monaco AMD loader (lazy: the real editor bundle is only fetched once this runs) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
